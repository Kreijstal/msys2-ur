# What Conan's PyProjectToolchain generates for pySavitar
[build-system]
requires = ["sip >=6.8"]
build-backend = "sipbuild.api"

[project]
name = "pySavitar"
version = "5.12.0"

[tool.sip.project]
sip-files-dir = "python"

[tool.sip.bindings.pySavitar]
exceptions = true
release-gil = true
libraries = ["Savitar", "pugixml"]
